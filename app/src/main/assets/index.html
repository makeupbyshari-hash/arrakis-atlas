<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Arrakis Atlas</title>
<style>
:root{color-scheme:dark;--bg:#10191e;--fg:#f8efd9;--muted:#b4bdc0;--gold:#f1bd73;--line:#34434b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,Roboto,sans-serif;color:var(--fg)}button,input,select{font:inherit}button{cursor:pointer}#app{display:flex;flex-direction:column;height:100dvh}header{background:#15232a;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0;color:var(--gold)}header small{color:var(--muted);font-size:11px}header strong{font-size:12px;color:#d0e4d4}.search{padding:9px;background:#1a282f;display:flex;gap:7px}.search input{min-width:0;flex:1;padding:12px;border:1px solid #546770;background:#101a1e;color:white;border-radius:10px}.search select{width:35%;max-width:130px;background:#101a1e;color:var(--fg);border:1px solid #546770;border-radius:10px}.filters{display:flex;gap:7px;overflow-x:auto;padding:8px 10px;background:#1a282f;border-bottom:1px solid var(--line);scrollbar-width:thin}.filters button{border:1px solid #52636d;background:#273740;color:var(--fg);padding:8px 11px;border-radius:20px;white-space:nowrap}.filters button.on{border-color:var(--gold);background:#5b4327;color:#ffe7ba}main{flex:1;position:relative;overflow:hidden;background:#29271f}#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#world{position:absolute;top:0;left:0;width:1100px;height:1100px;transform-origin:0 0;background:radial-gradient(#827052,#312e28);border:2px solid #b2986a;will-change:transform}#mapimg{width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}#fallback{position:absolute;inset:0;display:none;background:repeating-linear-gradient(0deg,transparent,transparent 108px,#ffffff18 109px,#ffffff18 110px),repeating-linear-gradient(90deg,transparent,transparent 108px,#ffffff18 109px,#ffffff18 110px),radial-gradient(#5b513d,#242d2f)}#markers{position:absolute;inset:0}.pin{position:absolute;transform:translate(-50%,-50%);border:2px dashed #ffe6aa;background:#8b5435cb;border-radius:100%;width:95px;height:95px;color:white;font-size:31px;display:grid;place-items:center;text-shadow:0 1px 6px black;box-shadow:0 3px 12px #000a}.pin.resource{background:#276f6aab;border-color:#93e7d9}.pin.place{background:#365677bb;border-color:#beddf3}.regionlabel{position:absolute;left:4%;top:90%;font-size:24px;font-weight:800;color:#fff7df;text-shadow:0 1px 8px black;pointer-events:none}#tip{position:absolute;top:10px;left:10px;right:65px;color:white;background:#192831dc;border:1px solid #6a6852;border-radius:9px;padding:7px 9px;font-size:12px;pointer-events:none;max-width:400px}#zoom{position:absolute;bottom:15px;right:12px;display:grid;gap:7px}#zoom button{border:1px solid #b78d58;background:#16242bea;color:var(--fg);font-size:23px;border-radius:10px;width:47px;height:45px}#results{display:none;position:absolute;z-index:3;top:8px;left:8px;right:8px;max-height:47%;overflow:auto;background:#111e23ee;border:1px solid #a78a5f;border-radius:12px;padding:7px}#results button{display:block;width:100%;color:var(--fg);background:#23333b;border:none;text-align:left;margin:3px 0;padding:9px;border-radius:8px}#results small{display:block;color:var(--muted)}#results .close{background:#5a3b2c;text-align:right}#detail{display:none;position:absolute;z-index:4;bottom:0;left:0;right:0;max-height:70%;overflow:auto;padding:18px;background:#14232bf5;border-top:2px solid var(--gold);border-radius:17px 17px 0 0;box-shadow:0 -10px 30px #0007}#detail h2{color:var(--gold);margin:0 0 6px;font-size:21px}#detail p{line-height:1.45}#detail .close{float:right;background:#2b3a42;color:white;border:1px solid #5c6d73;padding:7px;border-radius:8px}#detail a{color:#f9c78f}.footnote{font-size:12px;color:#d6c2a5;background:#1c292e;padding:5px 10px}
</style></head><body><div id="app"><header><div><h1>◇ ARRAKIS ATLAS</h1><small>Dune: Awakening · Beta 2026</small></div><strong>Nur deine Auswahl</strong></header>
<div class="search"><input id="q" placeholder="Händler, Jodtabletten, Rohstoff ..." aria-label="Suchen"><select id="region" aria-label="Kartengebiet"><option value="hagga">Hagga-Becken</option><option value="deep">Tiefe Wüste</option></select></div>
<nav class="filters" aria-label="Kartenfilter"><button data-filter="wander">Wanderhändler</button><button data-filter="trader">Feste Händler</button><button data-filter="resource">Materialien</button><button data-filter="place">Gebiete</button><button id="clear">Alles ausblenden</button></nav>
<main><div id="viewport"><div id="world"><img id="mapimg" alt="Spielkarte"><div id="fallback"></div><div id="markers"></div><div class="regionlabel" id="label"></div></div></div><div id="tip">2 Finger zoomen · 1 Finger verschieben · gestrichelte Kreise = ungefähre Gebiete</div><div id="results"></div><div id="zoom"><button id="plus" aria-label="Vergrößern">+</button><button id="minus" aria-label="Verkleinern">−</button><button id="reset" aria-label="Zurücksetzen">⌂</button></div><div id="detail"></div></main><div class="footnote">Beta: noch nicht alle Händler erfasst. Dynamische Spawnorte sind nicht garantiert.</div></div>
<script>
(()=>{'use strict';
const data=[
{id:'arkady',name:'Arkady Demidenko',kind:'wander',area:'hagga',x:14,y:78,place:'Sheol: mögliche dynamische Begegnungen am Rand des radioaktiven Gebiets; weitere Spielerberichte nennen den Übergang nach Mysa Tarill.',goods:['Jodtabletten','Jasmiumkristalle','Verstrahlte Schlacke'],details:'Nicht dauerhaft an einer festen Position. Achte auf rote Signalraketen und provisorische Händlerlager.',source:'https://dune.gaming.tools/hagga-basin'},
{id:'aliza',name:'Aliza Decastille',kind:'wander',area:'hagga',x:67,y:47,place:'Gemeldete Regionen: Östliche Vermillius-Kluft, Hagga-Rift, Östlicher Schildwall, Mysa Tarill.',goods:['Tausch: Kupfer-Schweißdraht gegen Agavensamen'],details:'Dynamische Händlerin. Markierung ist nur eine grobe Suchregion.',source:'https://duneawakeningwiki.de/index.php?title=Dynamische_Begegnungen'},
{id:'shahbazi',name:'Shahbazi Hoon',kind:'wander',area:'hagga',x:64,y:45,place:'Gemeldete Regionen: Vermillius-Kluft, Jabal Eifrit Al-sharq, Östlicher Schildwall, Mysa Tarill.',goods:['Tausch: Treibstoffzellen gegen Solari'],details:'Dynamischer Schrotthändler, keine dauerhafte Position. Handel laut Community-Wiki.',source:'https://duneawakeningwiki.de/index.php?title=Dynamische_Begegnungen'},
{id:'jasmium',name:'Jasmiumkristalle',kind:'resource',area:'hagga',x:15,y:84,place:'Sheol, radioaktives Gebiet im südwestlichen Hagga-Becken.',goods:[],details:'Grobes Abbaugebiet, keine garantierte Einzelader. Schutz vor Strahlung nötig.',source:'https://dune.gaming.tools/hagga-basin'},
{id:'agave',name:'Agavensamen',kind:'resource',area:'hagga',x:36,y:66,place:'O’odham und weitere Agaven-Fundgebiete.',goods:[],details:'Zutat für Jodtabletten. Die Markierung ist nicht punktgenau.',source:'https://dune.gaming.tools/hagga-basin'},
{id:'sheol',name:'Sheol – Strahlungsgebiet',kind:'place',area:'hagga',x:14,y:82,place:'Südwestliches Hagga-Becken.',goods:[],details:'Hier gibt es strahlenbelastete Ressourcen und dynamische Begegnungen.',source:'https://dune.gaming.tools/hagga-basin'},
{id:'deep',name:'Tiefe Wüste – wechselnde Wochenkarte',kind:'place',area:'deep',x:50,y:50,place:'Tiefe Wüste – Layout kann nach Coriolis-Stürmen wechseln.',goods:[],details:'Ohne bestätigte aktuelle Wochenkarte werden keine erfundenen Fundstellen angezeigt.',source:'https://dune.gaming.tools/deep-desert'}
];
const maps={hagga:'https://raw.githubusercontent.com/Abarrach/La-maison-des-Havres-Gris/main/map.jpg',deep:'https://raw.githubusercontent.com/Abarrach/La-maison-des-Havres-Gris/main/deep_desert.jpg'};
const $=id=>document.getElementById(id),v=$('viewport'),w=$('world'),img=$('mapimg'),markers=$('markers'),q=$('q'),r=$('region'),results=$('results'),detail=$('detail');
const selected=new Set();let scale=1,tx=0,ty=0;const SIZE=1100,pointers=new Map();let gesture=null;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]||'&#39;'));
const kind=k=>({wander:'Dynamischer Händler',trader:'Fester Händler',resource:'Rohstoff / Zutat',place:'Gebiet'})[k]||k;
function fit(){let a=v.getBoundingClientRect();scale=Math.min(a.width,a.height)/SIZE;tx=(a.width-SIZE*scale)/2;ty=(a.height-SIZE*scale)/2;apply();}
function apply(){w.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';}
function zoom(f,cx=v.clientWidth/2,cy=v.clientHeight/2){let ns=Math.max(.22,Math.min(18,scale*f));tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;apply();}
function open(rec){results.style.display='none';let h='<button class="close" id="dclose">Schließen ✕</button><h2>'+esc(rec.name)+'</h2><b>'+esc(kind(rec.kind))+'</b><p><b>Gebiet / mögliche Standorte:</b> '+esc(rec.place)+'</p>';if(rec.goods.length)h+='<p><b>Waren / Tausch:</b> '+rec.goods.map(esc).join(' · ')+'</p>';h+='<p>'+esc(rec.details)+'</p><p style="font-size:12px">Angaben aus Community-Quellen; nicht als feste Position bestätigt.<br><a href="'+rec.source+'" target="_blank" rel="noopener">Quelle öffnen</a></p>';detail.innerHTML=h;detail.style.display='block';$('dclose').onclick=()=>detail.style.display='none';}
function matches(rec){let s=norm([rec.name,rec.place,rec.details,...rec.goods].join(' ')),term=norm(q.value);if(rec.area!==r.value)return false;return term?s.includes(term):selected.has(rec.kind);}
function render(){markers.replaceChildren();let items=data.filter(matches);for(let rec of items){let b=document.createElement('button');b.className='pin '+(rec.kind==='resource'?'resource':rec.kind==='place'?'place':'');b.style.left=rec.x+'%';b.style.top=rec.y+'%';b.textContent=rec.kind==='resource'?'◆':rec.kind==='place'?'⌖':'◈';b.setAttribute('aria-label',rec.name);b.title=rec.name;b.onclick=e=>{e.stopPropagation();open(rec)};markers.appendChild(b);}
results.replaceChildren();if(q.value.trim()){results.style.display='block';let close=document.createElement('button');close.className='close';close.textContent='Suche schließen ✕';close.onclick=()=>{q.value='';render()};results.appendChild(close);for(let rec of items){let b=document.createElement('button');b.innerHTML=esc(rec.name)+'<small>'+esc(kind(rec.kind))+' · '+esc(rec.place.slice(0,65))+'</small>';b.onclick=()=>{open(rec);};results.appendChild(b)}if(!items.length){let d=document.createElement('div');d.textContent='Keine Einträge in dieser Beta. Die Datenbank wird weiter ausgebaut.';d.style.padding='14px';results.appendChild(d)}}else results.style.display='none';}
function switchMap(){detail.style.display='none';img.onload=()=>{$('fallback').style.display='none'};img.onerror=()=>{$('fallback').style.display='block';$('tip').textContent='Kartenbild nicht erreichbar: Internet oder externe Quelle prüfen.'};$('fallback').style.display='none';img.src=maps[r.value];$('label').textContent=r.value==='hagga'?'HAGGA-BECKEN':'TIEFE WÜSTE – WEEKLY';fit();render();}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{let k=b.dataset.filter;selected.has(k)?selected.delete(k):selected.add(k);b.classList.toggle('on',selected.has(k));render()});$('clear').onclick=()=>{selected.clear();q.value='';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('on'));detail.style.display='none';render()};q.oninput=render;r.onchange=switchMap;$('plus').onclick=()=>zoom(1.8);$('minus').onclick=()=>zoom(1/1.8);$('reset').onclick=fit;
v.addEventListener('wheel',e=>{e.preventDefault();let box=v.getBoundingClientRect();zoom(e.deltaY<0?1.25:.8,e.clientX-box.left,e.clientY-box.top)},{passive:false});
v.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;v.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);gesture=null;});
v.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);let list=[...pointers.values()];if(list.length===1){tx+=e.clientX-old[0];ty+=e.clientY-old[1];apply()}else if(list.length===2){let [a,b]=list;let mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];let dist=Math.hypot(a[0]-b[0],a[1]-b[1]);let rect=v.getBoundingClientRect();if(!gesture){gesture={dist,scale,tx,ty,mid}}else{let ns=Math.max(.22,Math.min(18,gesture.scale*dist/Math.max(1,gesture.dist)));tx=mid[0]-rect.left-(gesture.mid[0]-rect.left-gesture.tx)*ns/gesture.scale;ty=mid[1]-rect.top-(gesture.mid[1]-rect.top-gesture.ty)*ns/gesture.scale;scale=ns;apply()}}});
function release(e){pointers.delete(e.pointerId);gesture=null}v.addEventListener('pointerup',release);v.addEventListener('pointercancel',release);window.addEventListener('resize',fit);switchMap();
})();
</script></body></html>
