plugins {
    id 'com.android.application'
}
android {
    namespace 'com.arrakis.atlas'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arrakis.atlas'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.0.10'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
