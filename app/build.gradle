plugins {
    id 'com.android.application'
}
android {
    namespace 'com.arrakis.atlas'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arrakis.atlas'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.0.10'
    }
    signingConfigs {
        atlasRelease {
            storeFile file(System.getenv('ATLAS_KEYSTORE_FILE') ?: "${rootDir}/missing-signing-key.p12")
            storePassword System.getenv('ATLAS_SIGNING_PASSWORD') ?: ''
            keyAlias 'arrakis-atlas'
            keyPassword System.getenv('ATLAS_SIGNING_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.atlasRelease
            minifyEnabled false
        }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
