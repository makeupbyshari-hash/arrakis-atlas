name: Build APK and Android start test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK requirements
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate embedded UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m, 'Missing UI script'
          Path('/tmp/atlas.js').write_text(m.group(1))
          PY
          node --check /tmp/atlas.js
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.arrakis.atlas/.AtlasActivity
            sleep 15
            adb shell pidof com.arrakis.atlas
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|com.arrakis.atlas'; then
              echo "ANDROID APP CRASHED"; exit 1
            fi
            adb shell screencap -p /sdcard/atlas-smoke.png
            adb pull /sdcard/atlas-smoke.png atlas-smoke.png
      - name: Upload APK and emulator screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arrakis-Atlas-APK-and-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            atlas-smoke.png
