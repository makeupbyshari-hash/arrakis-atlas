name: Build APK and Android start test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Source checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK requirements
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate complete offline Dune item catalog
        run: |
          python3 tools/fetch_items.py
          test $(stat -c%s app/src/main/assets/items.js) -gt 150000
          grep -q 'Industrial Pump' app/src/main/assets/items.js
          grep -q 'Complex Machinery' app/src/main/assets/items.js
      - name: Validate embedded UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m, 'Missing UI script'
          Path('/tmp/atlas.js').write_text(m.group(1))
          PY
          node --check /tmp/atlas.js
          node --check app/src/main/assets/items.js
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download GPL-licensed offline map images
        run: |
          curl -fL --retry 3 --max-time 180 https://raw.githubusercontent.com/Abarrach/La-maison-des-Havres-Gris/main/map.jpg -o app/src/main/assets/map.jpg
          curl -fL --retry 3 --max-time 180 https://raw.githubusercontent.com/Abarrach/La-maison-des-Havres-Gris/main/deep_desert.jpg -o app/src/main/assets/deep_desert.jpg
          curl -fL --retry 3 --max-time 60 https://raw.githubusercontent.com/Abarrach/La-maison-des-Havres-Gris/main/LICENSE -o app/src/main/assets/map-license.txt
          test $(stat -c%s app/src/main/assets/map.jpg) -gt 1000000
          test $(stat -c%s app/src/main/assets/deep_desert.jpg) -gt 1000000
          file app/src/main/assets/map.jpg app/src/main/assets/deep_desert.jpg
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.arrakis.atlas/.AtlasActivity
            sleep 15
            adb shell pidof com.arrakis.atlas
            ! adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|com.arrakis.atlas'
            adb shell screencap -p /sdcard/atlas-smoke.png
            adb pull /sdcard/atlas-smoke.png atlas-smoke.png
      - name: Upload APK and emulator screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arrakis-Atlas-APK-and-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            atlas-smoke.png
