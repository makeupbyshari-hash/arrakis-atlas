name: Publish tested Android APK
on:
  workflow_run:
    workflows: ["Build APK and Android start test"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Accept only current source revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LATEST=$(gh api "repos/$REPO/branches/main" --jq .commit.sha)
          if [ "$LATEST" != "$SOURCE_SHA" ]; then
            echo "Outdated APK source revision; refusing to publish."
            exit 1
          fi
      - name: Download APK from successful tested build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          gh run download "$RUN_ID" -R "$REPO" --name Arrakis-Atlas-APK-and-test -D out
          test -s out/app/build/outputs/apk/debug/app-debug.apk
          cp out/app/build/outputs/apk/debug/app-debug.apk Arrakis_Atlas_2026_v1.0.14.apk
      - name: Publish beta APK as directly downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.14 -R "$REPO" >/dev/null 2>&1; then
            gh release upload v1.0.14 Arrakis_Atlas_2026_v1.0.14.apk -R "$REPO" --clobber
          else
            gh release create v1.0.14 Arrakis_Atlas_2026_v1.0.14.apk -R "$REPO" --title "Arrakis Atlas 1.0.14 (Beta)" --prerelease --notes "Fahrzeugplaner mit auswählbarem Zweck: Buggy zum Abbau, Transport oder beidem, Sandbike, Scout- und Kampfthopter sowie Frachtthopter für Fahrzeugtransport. Deutsche Spielnamen, Zutaten je Bauteil, Material-Gesamtsumme und Lagerabzug. Direkte Navigation aus der Karte. Test im Android-Emulator und Browser. Separate installierbare APK."
          fi
