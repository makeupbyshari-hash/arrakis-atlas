name: Publish tested Android APK
on:
  workflow_run:
    workflows: ["Build APK and Android start test"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_commit.message == 'Release v1.0.11' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Accept only current source revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LATEST=$(gh api "repos/$REPO/branches/main" --jq .commit.sha)
          if [ "$LATEST" != "$SOURCE_SHA" ]; then
            echo "Outdated APK source revision; refusing to publish."
            exit 1
          fi
      - name: Download APK from successful tested build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          gh run download "$RUN_ID" -R "$REPO" --name Arrakis-Atlas-APK-and-test -D out
          test -s out/app/build/outputs/apk/release/app-release.apk
          cp out/app/build/outputs/apk/release/app-release.apk Arrakis_Atlas_2026_v1.0.11.apk
      - name: Publish beta APK as directly downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.11 -R "$REPO" >/dev/null 2>&1; then
            gh release upload v1.0.11 Arrakis_Atlas_2026_v1.0.11.apk -R "$REPO" --clobber
          else
            gh release create v1.0.11 Arrakis_Atlas_2026_v1.0.11.apk -R "$REPO" --title "Arrakis Atlas 1.0.11 (Beta)" --prerelease --notes "Beta 2026: deutsche Händlerwaren werden automatisch in die Itemsuche aufgenommen. Neue Farmorte für Verstrahlte Schlacke: Sheol-Wrackgebiet, Delphis, Ourea und dynamische Schiffswracks. Anbieter Arkady Demidenko mit ausgewiesenem Solari-Preis. Enthält zudem Händlermenüs, Erzgebiete, Taxis, Auftragstafeln und Atlas-App-Icon. Detaillierte externe Mehrstufenkarte noch nicht integriert. Der Item-Katalog ist vollständiger als die separat geprüften Fundorte. APK wurde im GitHub-Workflow gebaut und auf einem Android-Emulator auf Startabstürze geprüft. Ab Version 1.0.11 dauerhaft signiert, sodass künftige APKs über bestehende Installationen aktualisiert werden können. Alte Debug-Versionen einmalig entfernen."
          fi
