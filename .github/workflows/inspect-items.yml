name: Inspect public Dune item data
on:
  push:
    paths:
      - '.github/workflows/inspect-items.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public item list response schema
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from urllib.parse import urlencode
          qslist=[{'limit':3},{'limit':3,'page':2},{'limit':3,'search':'industrial pump'}]
          for qs in qslist:
              url='https://api.awakening.wiki/items?'+urlencode(qs)
              print('URL:',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ArrakisAtlas/0.2 (public game item research)'})
                  with urllib.request.urlopen(req,timeout=20) as response: payload=json.load(response)
                  print('top level keys:',list(payload) if isinstance(payload,dict) else type(payload).__name__)
                  if isinstance(payload,dict):
                      print('pageInfo:',json.dumps(payload.get('pageInfo'),ensure_ascii=False)[:1000])
                      entries=payload.get('list',[])
                      print('list count:',len(entries))
                      for row in entries[:2]:
                          print('item keys:',list(row)[:45], 'name:',row.get('name'), 'id:',row.get('id'))
                          print('item sample:',json.dumps(row,ensure_ascii=False)[:2000])
              except Exception as e:print('ERR',str(e)[:400])
          PY
