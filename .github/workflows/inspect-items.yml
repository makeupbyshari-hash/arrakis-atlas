name: Inspect public Dune item data
on:
  push:
    paths:
      - '.github/workflows/inspect-items.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public API data availability and fields
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          for url in ('https://api.awakening.wiki/items/count','https://api.awakening.wiki/items?limit=2','https://api.awakening.wiki/openapi.json'):
              print('URL:',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ArrakisAtlas-open-source-research/0.1'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(5000000)
                      data=json.loads(body)
                  if isinstance(data,list):
                      print('list items:',len(data), 'first keys:',list(data[0])[:35] if data and isinstance(data[0],dict) else '')
                      if data and isinstance(data[0],dict):print('first name:',data[0].get('name'), 'second:',data[1].get('name') if len(data)>1 else '')
                  elif isinstance(data,dict):
                      print('keys:',list(data)[:35])
                      if 'paths' in data:print('paths:',list(data['paths'])[:30])
                      for k in ('results','data','items'):
                          if isinstance(data.get(k),list):
                              print('collection',k,'len:',len(data[k]),'first keys:',list(data[k][0])[:35] if data[k] and isinstance(data[k][0],dict) else '')
                      for k in ('count','total','total_count'):print(k,data.get(k))
                  else:print('value type:',type(data).__name__)
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e)[:300])
          PY
